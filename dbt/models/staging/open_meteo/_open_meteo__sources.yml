sources:
  - name: open_meteo
    description: >
      Open-Meteo Archive API, hourly weather at the Golemio AQ station coordinates
      (`extract/open_meteo.py`). One partition per UTC day; recent days are re-loaded (revisions).
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
      meta:
        # Bronze root is relative to dbt/; override with BRONZE_ROOT (e.g. absolute path).
        external_location: >-
          read_parquet('{{ env_var("BRONZE_ROOT", "../data/bronze") }}/{name}/*/*.parquet', hive_partitioning = true)
    tables:
      - name: open_meteo_weather_hourly
        description: >
          One row per station x hour. `latitude/longitude/elevation` are the model grid cell,
          `requested_*` the station coordinates. `time` is UTC (YYYY-MM-DDTHH:MM); wind speed in km/h.
        columns:
          - name: station_id
            data_tests: [not_null]
          - name: time
            data_tests: [not_null]
