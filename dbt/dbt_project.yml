name: prague
version: "0.1.0"
config-version: 2
profile: prague

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Lookback window (days) re-processed by incremental facts for late-arriving data.
  incremental_lookback_days: 3

models:
  prague:
    staging:
      +schema: silver
      # Tables, not views: views would keep relative read_parquet() paths to bronze and break
      # for any consumer not running from dbt/ (Streamlit, notebooks).
      +materialized: table
    marts:
      +schema: gold
      +materialized: table

snapshots:
  prague:
    +schema: snapshots

seeds:
  prague:
    +schema: seeds
