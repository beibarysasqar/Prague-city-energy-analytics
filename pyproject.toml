[project]
name = "prague-city-energy-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "entsoe-py>=0.8.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
snowflake = [
    "dbt-snowflake>=1.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.10",
    "sqlfluff>=4.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dbt/dbt_packages", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::bs4.XMLParsedAsHTMLWarning"]
